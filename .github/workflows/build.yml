name: Build APK & Web

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders if missing
        run: bash tool/ensure_platforms.sh

      # توقيع نسخة المتجر: بيشتغل بس لو الـ Secrets متضافة (شوف docs/RELEASE.md)
      - name: Release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "• Signing with the release key"
          else
            echo "• No release key secrets — building with the debug key (fine for testing)"
          fi

      - name: Install packages
        run: flutter pub get

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build App Bundle (Google Play)
        run: flutter build appbundle --release

      - name: Build Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Eldawly-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Eldawly-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Eldawly-Web
          path: build/web
