name: Build APK & Web

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # رقم النسخة وملاحظاتها من release.json (زي الرفيق)
      - name: Read version
        id: v
        run: |
          V=$(python3 -c "import json;print(json.load(open('release.json'))['version'])")
          IFS=. read MA MI PA <<< "$V"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "code=$((MA*10000 + MI*100 + PA))" >> $GITHUB_OUTPUT
          echo "• Version $V"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders if missing
        run: bash tool/ensure_platforms.sh

      # توقيع نسخة المتجر: بيشتغل بس لو الـ Secrets متضافة (شوف docs/RELEASE.md)
      - name: Release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "• Signing with the release key"
            echo "SIGNED=1" >> $GITHUB_ENV
          else
            echo "• No release key secrets — building with the debug key (fine for testing)"
          fi

      - name: Install packages
        run: flutter pub get

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build APK (release)
        run: |
          flutter build apk --release --build-name=${{ steps.v.outputs.version }} --build-number=${{ steps.v.outputs.code }} \
            --dart-define=APP_VERSION=${{ steps.v.outputs.version }} --dart-define=CHANNEL=github
          cp build/app/outputs/flutter-apk/app-release.apk studio-eldawly.apk

      # نسخة المتجر: من غير صلاحية تثبيت التحديثات (جوجل بلاي هو اللي بيحدّثها)
      - name: Build App Bundle (Google Play)
        run: |
          sed -i '/REQUEST_INSTALL_PACKAGES/d' android/app/src/main/AndroidManifest.xml
          flutter build appbundle --release --build-name=${{ steps.v.outputs.version }} --build-number=${{ steps.v.outputs.code }} \
            --dart-define=APP_VERSION=${{ steps.v.outputs.version }} --dart-define=CHANNEL=play

      - name: Build Web
        run: flutter build web --release --dart-define=APP_VERSION=${{ steps.v.outputs.version }} --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Eldawly-APK
          path: studio-eldawly.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Eldawly-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Eldawly-Web
          path: build/web

      # نشر التحديث: التطبيق بيشوف آخر Release ويعرض التحديث جوّه.
      # بيتنشر بس لو التوقيع ثابت (Secrets متضافة)، عشان التحديث يتثبّت فوق النسخة القديمة.
      - name: Publish update
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/flutter-app' && env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Studio-Eldawly ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: "Studio-Eldawly لأندرويد — حمّل studio-eldawly.apk وثبّته. التطبيق بيحدّث نفسه بعد كده من جوّه. تصميم وتطوير Mohamed Eldawly"
          files: |
            studio-eldawly.apk
            release.json
          make_latest: true
          overwrite_files: true

      - name: Update not published (no signing key)
        if: github.ref == 'refs/heads/flutter-app' && env.SIGNED != '1'
        run: echo "::warning::التحديث ماتنشرش لأن مفتاح التوقيع (ANDROID_KEYSTORE_*) مش متضاف في Secrets — شوف docs/RELEASE.md"
