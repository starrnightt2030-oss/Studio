name: studio_eldawly
description: "Studio-Eldawly — استوديو تعليق صوتي عربي بالذكاء الاصطناعي (Gemini TTS)، مجاني بمفتاح المستخدم."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Network & storage
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0
  crypto: ^3.0.6
  uuid: ^4.5.1

  # Audio & files
  audioplayers: ^6.4.0
  flutter_tts: ^4.2.2
  share_plus: ^10.1.4
  file_picker: ^10.0.0

  url_launcher: ^6.3.1

  # UI
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/audio/

  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-400.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-500.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-600.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-700.ttf
          weight: 700
        - asset: assets/fonts/Alexandria-800.ttf
          weight: 800
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-500.ttf
          weight: 500
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
        - asset: assets/fonts/Sora-800.ttf
          weight: 800
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon_launcher.png"
  min_sdk_android: 21
  adaptive_icon_background: "#070B17"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon_launcher.png"
    background_color: "#070B17"
    theme_color: "#6C4DE6"
